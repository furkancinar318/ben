<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ben">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ben</title>
<style>:root{
  --accent:#6C63FF; --accent-2:#8B85FF; --accent-soft:rgba(108,99,255,.14);
  --bg:#F2F2F7; --card:#FFFFFF; --card-2:#F7F7FA; --text:#111114; --muted:#8A8A93; --line:rgba(0,0,0,.08);
  --ok:#30C26B; --warn:#FFB020; --bad:#FF4D5E; --tab:rgba(255,255,255,.82);
  --muscle-off:#C4C4D0; --body:#DEDEE6; --body-line:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --r:18px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme=dark]{
  --bg:#0B0B0F; --card:#17171D; --card-2:#202028; --text:#F4F4F7; --muted:#8C8C98; --line:rgba(255,255,255,.08);
  --tab:rgba(20,20,26,.82); --muscle-off:#474754; --body:#2B2B35; --body-line:#17171D; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input[type=checkbox]{width:auto}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 96px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 2px 16px}
.top h1{font-size:32px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.6px}
.top .sub{color:var(--muted);font-size:14px;margin-bottom:4px;font-weight:500}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:16px;margin:6px 0 -6px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.tight{padding:4px 0}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11px}
.b{font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;font-weight:700;border-radius:14px;padding:12px 16px;font-size:15px}
.btn.full{width:100%}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--card-2);color:var(--text)}
.btn.danger{background:rgba(255,77,94,.12);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);font-size:20px;color:var(--accent);font-weight:700}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(var(--safe-b) + 84px);width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;font-size:30px;font-weight:400;box-shadow:0 8px 24px rgba(108,99,255,.4);z-index:20;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);white-space:nowrap}
.chip.on{background:var(--accent);color:#fff}
.chip.p{background:var(--accent);color:#fff}
.chip.s{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;margin-right:4px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:.15s}
.check.on{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:15px}
.empty .e{font-size:38px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:var(--r);padding:16px 14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:8px;min-height:96px}
.tile .ic{font-size:26px}
.tile .nm{font-weight:700;font-size:15px}
.tile .ds{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.stars{color:#FFB020;letter-spacing:1px;font-size:15px}
.stars .off{color:var(--muscle-off)}
.star-pick{display:flex;gap:6px;font-size:32px}
.star-pick button{color:var(--muscle-off)} .star-pick button.on{color:#FFB020}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px 2px}
.seg{display:flex;background:var(--card-2);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 6px calc(var(--safe-b) + 6px)}
.tabbar .in{max-width:640px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:10.5px;font-weight:600}
.tabbar button .i{font-size:22px;filter:grayscale(1);opacity:.7}
.tabbar button.on{color:var(--accent)} .tabbar button.on .i{filter:none;opacity:1}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;transition:opacity .2s}
.sheet-bg.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet.full{height:100vh;max-height:100vh;border-radius:0;padding-top:var(--safe-t)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:10px}
.sheet-h .ttl{font-weight:800;font-size:18px;text-align:center;flex:1}
.sheet-h button{color:var(--accent);font-weight:600;min-width:60px;text-align:left}
.sheet-h button:last-child{text-align:right}
.sheet-b{overflow-y:auto;padding:4px 16px calc(var(--safe-b) + 24px);-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%) translateY(-120%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:90;transition:transform .25s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
/* mood */
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;font-size:30px;padding:8px 0;border-radius:14px;background:var(--card-2);filter:grayscale(.9);opacity:.6;transition:.15s}
.moods button.on{filter:none;opacity:1;background:var(--accent-soft);transform:scale(1.05)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--card-2);color:var(--muted)}
.cal .h{background:none;font-size:11px}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--muscle-off)}
.dots i.on{background:var(--ok)}
/* sport */
.body-map svg{width:100%;height:auto;display:block}
.mrow{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.mrow .n{width:88px;flex:none;font-weight:600}
.mrow .bar{flex:1}
.mrow .v{width:108px;text-align:right;color:var(--muted);font-size:11.5px;flex:none;white-space:nowrap}
.ex-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ex-item:last-child{border-bottom:0}
.ex-thumb{width:46px;height:52px;flex:none;border-radius:10px;background:var(--card-2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.ex-thumb img{width:100%;height:100%;object-fit:cover}
.ex-thumb svg{height:100%;width:auto;max-width:100%;padding:3px 0}
.ex-thumb.mini{width:62px;height:60px}
.set-row{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.set-row input{padding:9px 8px;text-align:center}
.set-row .no{font-weight:700;color:var(--muted);text-align:center}
.set-row.ok input{background:rgba(48,194,107,.12);border-color:rgba(48,194,107,.3)}
.set-row .chk{width:40px;height:40px;border-radius:12px;background:var(--card-2);font-size:18px;color:var(--muted)}
.set-row.ok .chk{background:var(--ok);color:#fff}
.timer{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 76px);max-width:608px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer .tm{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer button{color:var(--bg);background:rgba(127,127,127,.25);padding:6px 10px;border-radius:10px;font-weight:700;font-size:14px}
.legend{display:flex;gap:10px;justify-content:center;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* diet */
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:24px;letter-spacing:-.5px}
.macro{margin:7px 0}
.macro .row{font-size:13px;margin-bottom:4px}
.water{display:flex;gap:5px;flex-wrap:wrap}
.water i{width:22px;height:30px;border-radius:5px 5px 8px 8px;background:var(--card-2);border:1.5px solid var(--line)}
.water i.on{background:#4DA3FF;border-color:#4DA3FF}
/* outfits */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--card);position:relative;box-shadow:var(--shadow)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .lb{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ph.sel{outline:3px solid var(--accent);outline-offset:-3px}
.ph.sel:after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800}
.collage{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-radius:12px;overflow:hidden;margin-bottom:8px}
.collage img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pin-dots i.on{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.keypad button{height:76px;border-radius:50%;background:var(--card);font-size:28px;font-weight:500;box-shadow:var(--shadow)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}
.hero .muted{color:rgba(255,255,255,.8)}
.kpi{font-size:26px;font-weight:800;letter-spacing:-.5px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--text)}
.chart svg{width:100%;height:auto;display:block}
.hr{height:1px;background:var(--line);margin:12px 0}
a{color:var(--accent)}

.exanim{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/2;background:var(--card-2)}
.exanim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exanim img.b{animation:exfade 2.4s infinite}
@keyframes exfade{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
ol.steps,ol.ticks,ol.warns{margin:0;padding-left:22px;line-height:1.5;font-size:15px}
ol.steps li,ol.ticks li,ol.warns li{margin:6px 0;padding-left:2px}
ol.ticks{list-style:none;padding-left:0} ol.ticks li:before{content:"✓ ";color:var(--ok);font-weight:800}
ol.warns{list-style:none;padding-left:0} ol.warns li:before{content:"• ";color:var(--bad);font-weight:800}
.warnc{background:rgba(255,77,94,.07);border:1px solid rgba(255,77,94,.18)}

.clickmap [data-m]:active{opacity:.6}
</style>

<body>
<div id="app"></div>
<nav class="tabbar" id="tabs"></nav>
<div class="toast" id="toast"></div>
<script>/* ===== Yardımcılar ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseD(k); d.setDate(d.getDate() + n); return dkey(d); };
const today = () => dkey();
const fmtDate = (k, o = { day: 'numeric', month: 'long' }) => k ? parseD(k).toLocaleDateString('tr-TR', o) : '';
const fmtMoney = n => (Number(n) || 0).toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ₺';
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const r1 = n => Math.round(n * 10) / 10;
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const WD = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const WD_LONG = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const stars = n => { n = Math.round(n || 0); let s = ''; for (let i = 1; i <= 5; i++) s += i <= n ? '★' : '<span class="off">★</span>'; return `<span class="stars">${s}</span>`; };

/* ===== Veri ===== */
const DEFAULT_STATE = () => ({
  v: 1,
  settings: { name: '', theme: 'auto', accent: '#6C63FF', pin: '', lock: null, rest: 90, bookGoal: 12 },
  moods: {}, journal: [], habits: [], todos: [], notes: [], courses: [], goals: [], dates: [],
  outfits: { items: [], combos: [] }, shopping: [], books: [], movies: [],
  workout: { exercises: [], days: [], logs: [], active: null, exPhotos: {} },
  diet: { targets: { kcal: 2200, p: 140, c: 240, f: 70, water: 2500 }, foods: [], log: {}, water: {}, weight: [], plan: [] }
});
let S = DEFAULT_STATE();

const Store = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('ben-app', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(k) {
    return new Promise(res => {
      if (!this.db) { try { res(JSON.parse(localStorage.getItem(k))); } catch (e) { res(null); } return; }
      try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); } catch (e) { res(null); }
    });
  },
  set(k, v) {
    return new Promise(res => {
      if (!this.db) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} res(); return; }
      try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); }
    });
  }
};
let saveT;
function save() {
  Meta.dirty = true; Meta.updatedAt = Date.now();
  clearTimeout(saveT); saveT = setTimeout(() => { Store.set('state', S); Store.set('meta', Meta); }, 250);
  Sync.schedule();
}
function merge(def, val) {
  if (Array.isArray(def)) return Array.isArray(val) ? val : def;
  if (def && typeof def === 'object') {
    const o = { ...def };
    if (val && typeof val === 'object') for (const k in val) o[k] = k in def ? merge(def[k], val[k]) : val[k];
    return o;
  }
  return val === undefined ? def : val;
}

/* ===== Arayüz parçaları ===== */
function toast(msg) {
  let t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}
let sheetStack = [];
function openSheet({ title = '', body = '', left = 'Kapat', right = '', onRight = null, full = false, onClose = null }) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const sh = document.createElement('div'); sh.className = 'sheet' + (full ? ' full' : '');
  sh.innerHTML = `<div class="sheet-h"><button data-l>${esc(left)}</button><div class="ttl">${esc(title)}</div><button data-r class="b">${esc(right)}</button></div><div class="sheet-b">${body}</div>`;
  document.body.append(bg, sh);
  requestAnimationFrame(() => { bg.classList.add('show'); sh.classList.add('show'); });
  const obj = { bg, sh, onClose, close: () => closeSheet(obj) };
  sh.querySelector('[data-l]').onclick = () => closeSheet(obj);
  sh.querySelector('[data-r]').onclick = () => { if (onRight) { if (onRight(sh) !== false) closeSheet(obj); } };
  bg.onclick = () => closeSheet(obj);
  sheetStack.push(obj);
  return obj;
}
function closeSheet(obj) {
  obj = obj || sheetStack[sheetStack.length - 1]; if (!obj) return;
  sheetStack = sheetStack.filter(x => x !== obj);
  obj.bg.classList.remove('show'); obj.sh.classList.remove('show');
  setTimeout(() => { obj.bg.remove(); obj.sh.remove(); }, 260);
  if (obj.onClose) obj.onClose();
  if (!sheetStack.length && Sync.pendingRender) { Sync.pendingRender = false; setTimeout(render, 280); }
}
function confirmSheet(msg, yes, label = 'Sil') {
  const s = openSheet({ title: 'Emin misin?', body: `<p style="text-align:center;margin:8px 0 18px">${esc(msg)}</p><button class="btn danger full" id="cy">${esc(label)}</button>` });
  s.sh.querySelector('#cy').onclick = () => { closeSheet(s); yes(); };
}

/* Fotoğraf küçültme */
function pickImage(cb, max = 700) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', .78));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}

function fieldHTML(f, v) {
  const id = 'f_' + f.k;
  let inp;
  switch (f.type) {
    case 'textarea': inp = `<textarea id="${id}" placeholder="${esc(f.ph || '')}" rows="${f.rows || 4}">${esc(v ?? '')}</textarea>`; break;
    case 'select': inp = `<select id="${id}">${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v ?? f.def ?? '') === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`; break;
    case 'stars': inp = `<div class="star-pick" id="${id}" data-v="${v || 0}">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-s="${i}" class="${i <= (v || 0) ? 'on' : ''}">★</button>`).join('')}</div>`; break;
    case 'toggle': inp = `<div class="seg" id="${id}" data-v="${v ? 1 : 0}"><button type="button" data-t="0" class="${!v ? 'on' : ''}">${esc(f.off || 'Hayır')}</button><button type="button" data-t="1" class="${v ? 'on' : ''}">${esc(f.on || 'Evet')}</button></div>`; break;
    case 'days': inp = `<div class="chips" id="${id}" style="flex-wrap:wrap">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" class="chip ${(v || []).includes(d) ? 'on' : ''}" data-d="${d}">${WD[d]}</button>`).join('')}</div>`; break;
    default: inp = `<input id="${id}" type="${f.type || 'text'}" ${f.type === 'number' ? 'inputmode="decimal" step="any"' : ''} placeholder="${esc(f.ph || '')}" value="${esc(v ?? (f.def ?? ''))}">`;
  }
  return `<div class="field"><label>${esc(f.label)}</label>${inp}</div>`;
}
function wireFields(root) {
  root.querySelectorAll('.star-pick').forEach(el => el.querySelectorAll('button').forEach(b => b.onclick = () => {
    const s = +b.dataset.s; const cur = +el.dataset.v; const nv = cur === s ? 0 : s; el.dataset.v = nv;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.s <= nv));
  }));
  root.querySelectorAll('.seg[data-v]').forEach(el => el.querySelectorAll('button').forEach(b => b.onclick = () => {
    el.dataset.v = b.dataset.t; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  }));
  root.querySelectorAll('.chips[id^=f_]').forEach(el => el.querySelectorAll('button').forEach(b => b.onclick = () => b.classList.toggle('on')));
}
function readFields(root, fields) {
  const o = {};
  for (const f of fields) {
    const el = root.querySelector('#f_' + f.k); if (!el) continue;
    if (f.type === 'stars') o[f.k] = +el.dataset.v;
    else if (f.type === 'toggle') o[f.k] = el.dataset.v === '1';
    else if (f.type === 'days') o[f.k] = [...el.querySelectorAll('.on')].map(b => +b.dataset.d);
    else if (f.type === 'number') o[f.k] = el.value === '' ? '' : num(el.value);
    else o[f.k] = el.value.trim();
  }
  return o;
}
/* list: dizi, item: mevcut kayıt veya null */
function editRecord({ title, list, item, fields, required, defaults = {}, after }) {
  const isNew = !item; const cur = item || { ...defaults };
  const body = fields.map(f => fieldHTML(f, cur[f.k])).join('') + (isNew ? '' : `<button class="btn danger full" id="del" style="margin-top:8px">Sil</button>`);
  const s = openSheet({
    title: (isNew ? 'Yeni ' : '') + title, body, left: 'Vazgeç', right: 'Kaydet',
    onRight: sh => {
      const v = readFields(sh, fields);
      if (required && !v[required]) { toast('Lütfen ' + fields.find(f => f.k === required).label.toLowerCase() + ' gir'); return false; }
      if (isNew) list.unshift({ id: uid(), created: Date.now(), ...defaults, ...v }); else Object.assign(item, v, { updated: Date.now() });
      save(); after ? after() : render();
    }
  });
  wireFields(s.sh);
  const d = s.sh.querySelector('#del');
  if (d) d.onclick = () => confirmSheet('Bu kayıt silinecek.', () => { const i = list.indexOf(item); if (i > -1) list.splice(i, 1); closeSheet(s); save(); after ? after() : render(); });
  setTimeout(() => { const first = s.sh.querySelector('input,textarea'); if (first && isNew && window.innerWidth > 700) first.focus(); }, 300);
}

function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function shade(h, p) { const n = parseInt(h.slice(1), 16); const f = c => Math.min(255, Math.round(c + (255 - c) * p / 100)); return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(x => pad(x.toString(16))).join(''); }

const hasLock = () => !!(S.settings.lock?.hash || S.settings.pin);
async function hashPass(p, saltB64) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(saltB64), iterations: 150000, hash: 'SHA-256' }, base, 256);
  return b64(new Uint8Array(bits));
}
async function setLockPass(p) {
  if (!p) { S.settings.lock = null; S.settings.pin = ''; save(); return; }
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  S.settings.lock = { salt, hash: await hashPass(p, salt) }; S.settings.pin = ''; save();
}
async function checkLockPass(p) {
  if (S.settings.lock?.hash) return (await hashPass(p, S.settings.lock.salt)) === S.settings.lock.hash;
  if (S.settings.pin && p === S.settings.pin) { await setLockPass(p); return true; } // eski PIN'i taşı
  return false;
}

// Supabase projesi oluşturulunca buraya yazılır; boşsa Ayarlar'dan girilebilir.
const APP_CONFIG = { supabaseUrl: 'https://omieemczsuqstuehcrtu.supabase.co', supabaseKey: 'sb_publishable_C8y1wMv8qvFrXAhGX4F8Ew_uTFhzpB9' };

const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function zip(u8, dir) {
  const st = new Blob([u8]).stream().pipeThrough(dir ? new CompressionStream('gzip') : new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function deriveKey(pass, saltB64) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(saltB64), iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptState(obj, key) {
  let bytes = new TextEncoder().encode(JSON.stringify(obj)); let z = false;
  if (window.CompressionStream) { bytes = await zip(bytes, true); z = true; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes));
  return { data: (z ? 'z:' : 'r:') + b64(ct), iv: b64(iv) };
}
async function decryptState(row, key) {
  let pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(row.iv) }, key, unb64(row.data.slice(2))));
  if (row.data.startsWith('z:')) pt = await zip(pt, false);
  return JSON.parse(new TextDecoder().decode(pt));
}

let Meta = { baseRev: 0, dirty: false, updatedAt: 0 };
const Sync = {
  cfg: null, key: null, busy: false, again: false, err: '', last: 0, timer: null,
  async load() {
    this.cfg = await Store.get('sync');
    try { this.key = await Store.get('synckey'); if (this.key && !(this.key instanceof CryptoKey)) this.key = null; } catch (e) { this.key = null; }
    Meta = { ...Meta, ...(await Store.get('meta') || {}) };
  },
  url() { return (this.cfg?.url || APP_CONFIG.supabaseUrl || '').replace(/\/+$/, ''); },
  apikey() { return this.cfg?.key || APP_CONFIG.supabaseKey; },
  on() { return !!(this.cfg && this.cfg.refresh && this.key); },
  saveCfg() { return Store.set('sync', this.cfg); },
  async auth(path, body) {
    const r = await fetch(this.url() + '/auth/v1/' + path, { method: 'POST', headers: { apikey: this.apikey(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(trErr(j.error_description || j.msg || j.message || j.error || ('Hata ' + r.status)));
    return j;
  },
  async setSession(j) {
    this.cfg = { ...(this.cfg || {}), access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, uid: j.user?.id || this.cfg?.uid, email: j.user?.email || this.cfg?.email };
    await this.saveCfg();
  },
  async token() {
    if (this.cfg.exp - Date.now() > 60000) return;
    await this.setSession(await this.auth('token?grant_type=refresh_token', { refresh_token: this.cfg.refresh }));
  },
  async api(path, opts = {}) {
    await this.token();
    const r = await fetch(this.url() + '/rest/v1/' + path, { ...opts, headers: { apikey: this.apikey(), Authorization: 'Bearer ' + this.cfg.access, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    const t = await r.text();
    if (!r.ok) { let m = t; try { m = JSON.parse(t).message || t; } catch (e) {} throw new Error(trErr(m.slice(0, 160) || 'Hata ' + r.status)); }
    return t ? JSON.parse(t) : null;
  },
  remote(cols = 'rev,updated_at,salt') { return this.api(`vault?select=${cols}&user_id=eq.${this.cfg.uid}`).then(r => r[0] || null); },
  async push(expectRev) {
    const enc = await encryptState(S, this.key);
    const now = new Date().toISOString();
    let rows;
    if (expectRev == null) rows = await this.api('vault', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ user_id: this.cfg.uid, ...enc, salt: this.cfg.salt, rev: 1, updated_at: now }) });
    else rows = await this.api(`vault?user_id=eq.${this.cfg.uid}&rev=eq.${expectRev}`, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ ...enc, rev: expectRev + 1, updated_at: now }) });
    if (!rows || !rows.length) return false; // başka cihaz araya girdi
    Meta.baseRev = rows[0].rev; Meta.dirty = false; await Store.set('meta', Meta); return true;
  },
  async applyRemote(row) {
    const data = await decryptState(row, this.key);
    S = merge(DEFAULT_STATE(), data); await Store.set('state', S);
    Meta.baseRev = row.rev; Meta.dirty = false; Meta.updatedAt = Date.parse(row.updated_at); await Store.set('meta', Meta);
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!sheetStack.length && !typing) render(); else this.pendingRender = true;
  },
  async run() {
    if (!this.on() || !navigator.onLine) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.err = '';
    try {
      for (let tries = 0; tries < 3; tries++) {
        const r = await this.remote();
        if (!r) { if (await this.push(null)) break; continue; }
        if (r.rev === Meta.baseRev) { if (!Meta.dirty || await this.push(r.rev)) break; continue; }
        // Bulutta daha yeni sürüm var
        const full = await this.remote('*');
        if (Meta.dirty) {
          const remoteT = Date.parse(full.updated_at);
          if (Meta.updatedAt > remoteT) { // bu cihaz daha yeni: buluttakini yedekle, bizimkini yükle
            try { await Store.set('conflict', { at: Date.now(), from: 'bulut', state: await decryptState(full, this.key) }); } catch (e) {}

          }
          await Store.set('conflict', { at: Date.now(), from: 'bu cihaz', state: JSON.parse(JSON.stringify(S)) });
          toast('Başka cihazdaki daha yeni değişiklikler alındı');
        }
        await this.applyRemote(full); break;
      }
      this.last = Date.now();
    } catch (e) { this.err = e.message || String(e); }
    this.busy = false; this.paint();
    if (this.again) { this.again = false; this.run(); }
  },
  schedule(ms = 2500) { if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  paint() { const el = $('#syncstat'); if (el) el.innerHTML = syncStatusHTML(); if (this.pendingRender && !sheetStack.length) { this.pendingRender = false; } },
  async signOut() { this.cfg = { url: this.cfg?.url, key: this.cfg?.key }; this.key = null; await this.saveCfg(); await Store.set('synckey', null); Meta.baseRev = 0; await Store.set('meta', Meta); }
};
function trErr(m) {
  const map = [[/Invalid login credentials/i, 'E-posta veya şifre hatalı'], [/Email not confirmed/i, 'E-posta adresin henüz onaylanmadı — gelen kutundaki bağlantıya tıkla'], [/User already registered/i, 'Bu e-posta ile zaten hesap var, giriş yap'], [/Password should be at least/i, 'Şifre en az 6 karakter olmalı'], [/Failed to fetch|NetworkError|Load failed/i, 'Sunucuya ulaşılamadı (internet veya adres hatalı)'], [/relation .*vault.* does not exist|Could not find the table/i, 'Supabase\'de "vault" tablosu yok — kurulum SQL\'ini çalıştır'], [/rate limit/i, 'Çok fazla deneme, biraz bekle']];
  for (const [r, t] of map) if (r.test(m)) return t; return m;
}

async function handleAuthRedirect() {
  const h = location.hash; if (!h.includes('access_token=')) return false;
  const p = new URLSearchParams(h.slice(1)); history.replaceState(null, '', location.pathname);
  if (p.get('error_description')) { toast(p.get('error_description')); return false; }
  try {
    Sync.cfg = { ...(Sync.cfg || {}) };
    await Sync.setSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: +p.get('expires_in') || 3600 });
    const u = await fetch(Sync.url() + '/auth/v1/user', { headers: { apikey: Sync.apikey(), Authorization: 'Bearer ' + Sync.cfg.access } }).then(r => r.json());
    Sync.cfg.uid = u.id; Sync.cfg.email = u.email; await Sync.saveCfg();

/* Noktalardan yumuşak kapalı eğri (Catmull-Rom → Bezier) */
function smoothPath(pts, t = 1) {
  const n = pts.length; const f = v => v.toFixed(1);
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6 * t, p1[1] + (p2[1] - p0[1]) / 6 * t];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6 * t, p2[1] - (p3[1] - p1[1]) / 6 * t];
    d += `C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + 'Z';
}

function heat(v) { const h = 140 - 140 * Math.min(1, v); return `hsl(${h},78%,${52 + (1 - v) * 4}%)`; }
/* vals: {kas: 0..1}; mode: heat | hi; vb: özel görünüm alanı */
function bodySVG(vals = {}, { mode = 'heat', labels = true, vb = null, click = false } = {}) {
  const fill = v => {
    if (!v || v < 0.01) return 'var(--muscle-off)';
    if (mode === 'hi') return v >= 1 ? 'var(--accent)' : 'var(--accent-2)';
    return heat(v);
  };
  const fig = (view, ox) => {
    const mir = `translate(${ox + 200},0) scale(-1,1)`;
    let m = '';
    for (const [k, v, d] of MPATHS) if (v === view) { const c = fill(vals[k]); m += `<path d="${d}" fill="${c}"${click ? ` data-m="${k}" style="cursor:pointer"` : ''}/>`; }
    const fib = FIBERS.filter(f => f[0] === view).map(f => `<path d="${f[1]}"/>`).join('');
    const half = `<g class="mus" stroke="var(--body-line)" stroke-width="1.3" stroke-linejoin="round">${m}</g><g fill="none" stroke="rgba(0,0,0,.13)" stroke-width=".7">${fib}</g>`;
    return `<g><path d="${SIL_D}" transform="translate(${ox},0)" fill="var(--body)"/><path d="${HEAD_D}" transform="translate(${ox},0)" fill="var(--body)"/>
      <g transform="translate(${ox},0)">${half}</g><g transform="${mir}">${half}</g></g>`;
  };
  const H = labels ? 520 : 500;
  const lab = labels ? `<text x="100" y="516" text-anchor="middle" font-size="15" fill="var(--muted)" font-weight="700">ÖN</text><text x="320" y="516" text-anchor="middle" font-size="15" fill="var(--muted)" font-weight="700">ARKA</text>` : '';
  return `<svg ${click ? 'class="clickmap" ' : ''}viewBox="${vb || `0 0 420 ${H}`}" xmlns="http://www.w3.org/2000/svg">${fig('f', 0)}${fig('b', 220)}${lab}</svg>`;
}

/* ===== Kas yükü sabitleri ===== */
const REC_H = { chest_up: 72, chest_mid: 72, chest_low: 72, lats: 72, quads: 72, hams: 72, glutes: 72, lowback: 72, traps_mid: 60 }; // diğerleri 48 saat
const FULL_SETS = 8; // bir kas için ~8 efektif set = tam yorgunluk
function exThumb(ex) {
  if (!ex) return '<div class="ex-thumb"></div>';
  const ph = exPhoto(ex);
  if (ph) return `<div class="ex-thumb"><img src="${ph}" alt="" loading="lazy" onerror="this.remove()"></div>`;
  const v = {}; ex.s.forEach(k => v[k] = .5); ex.p.forEach(k => v[k] = 1);
  const BACK = ['lats', 'triceps', 'lowback', 'glutes', 'hams', 'rdelt', 'traps_up', 'traps_mid'], LOW = ['quads', 'hams', 'glutes', 'calves', 'adductors'];
  const back = ex.p.filter(k => BACK.includes(k)).length > ex.p.filter(k => !BACK.includes(k) && !['calves', 'sdelt', 'forearm'].includes(k)).length;
  const low = ex.p.every(k => LOW.includes(k));
  const vb = low ? (back ? VB.lowerB : VB.lowerF) : (back ? VB.upperB : VB.upperF);
  return `<div class="ex-thumb">${bodySVG(v, { mode: 'hi', labels: false, vb })}</div>`;
}
function levelLabel(v) { if (v < .01) return '—'; if (v < .3) return 'Hafif'; if (v < .6) return 'Orta'; if (v < .85) return 'Yüksek'; return 'Çok yüksek'; }
function muscleBars(vals, unit = '') {
  const arr = Object.entries(vals).filter(([, v]) => v > .005).sort((a, b) => b[1] - a[1]);
  if (!arr.length) return '<div class="muted small" style="text-align:center;padding:6px">Henüz kas yükü yok</div>';
  return arr.map(([k, v]) => `<div class="mrow"><span class="n">${MUSCLES[k]}</span><div class="bar"><i style="width:${Math.round(Math.min(1, v) * 100)}%;background:${heat(v)}"></i></div><span class="v">${levelLabel(v)} · %${Math.round(Math.min(1, v) * 100)}</span></div>`).join('');
}
const LEGEND = `<div class="legend"><span><i style="background:${heat(.15)}"></i>Hafif</span><span><i style="background:${heat(.5)}"></i>Orta</span><span><i style="background:${heat(.75)}"></i>Yüksek</span><span><i style="background:${heat(1)}"></i>Çok yüksek</span></div>`;

const EX_CATS = ['Göğüs', 'Sırt', 'Omuz', 'Kol', 'Bacak', 'Karın', 'Kendi'];
const allEx = () => [...BUILTIN_EX, ...S.workout.exercises];
const exById = id => BUILTIN_EX.find(e => e.id === id) || S.workout.exercises.find(e => e.id === id);
const exPhoto = ex => ex.builtin ? (S.workout.exPhotos || {})[ex.id] || (ex.img ? `img/${ex.id.slice(2)}_0.jpg` : '') : ex.img;
const exUserPhoto = ex => ex.builtin ? (S.workout.exPhotos || {})[ex.id] : ex.img;

/* ===== Yük ve toparlanma hesapları ===== */
function dayLoad(items) {
  const m = {};
  for (const it of items) {
    const ex = exById(it.exId); if (!ex) continue;
    const n = it.sets !== undefined ? (+it.sets || 0) : (it.sets_arr || []).length;
    ex.p.forEach(k => m[k] = (m[k] || 0) + n);
    ex.s.forEach(k => m[k] = (m[k] || 0) + n * .5);
  }
  const out = {}; for (const k in m) out[k] = m[k] / FULL_SETS; return out;
}
function recovery() {
  const now = Date.now(); const m = {};
  for (const lg of S.workout.logs) {
    const h = (now - lg.ts) / 36e5; if (h > 80 || h < 0) continue;
    for (const en of lg.entries) {
      const ex = exById(en.exId); if (!ex) continue;
      const n = en.sets.length;
      const add = (k, w) => { const dec = Math.max(0, 1 - h / (REC_H[k] || 48)); m[k] = (m[k] || 0) + n * w * dec / FULL_SETS; };
      ex.p.forEach(k => add(k, 1)); ex.s.forEach(k => add(k, .5));
    }
  }
  return m;
}
function lastPerf(exId) {
  for (let i = S.workout.logs.length - 1; i >= 0; i--) {
    const en = S.workout.logs[i].entries.find(e => e.exId === exId);
    if (en) return { log: S.workout.logs[i], sets: en.sets };
  }
  return null;
}
function exHistory(exId) {
  const pts = [];
  for (const lg of S.workout.logs) {
    const en = lg.entries.find(e => e.exId === exId); if (!en || !en.sets.length) continue;
    const best = Math.max(...en.sets.map(s => num(s.w)));
    const e1rm = Math.max(...en.sets.map(s => num(s.w) * (1 + num(s.r) / 30)));
    const vol = en.sets.reduce((a, s) => a + num(s.w) * num(s.r), 0);
    pts.push({ date: lg.date, best, e1rm, vol, sets: en.sets });
  }
  return pts;
}

/* ===== Basit çizgi grafik ===== */
function lineChart(pts, { unit = '', color = 'var(--accent)', h = 150 } = {}) {
  if (pts.length < 1) return '<div class="muted small" style="text-align:center;padding:18px">Grafik için veri yok</div>';
  const W = 320, H = h, P = 26;
  const ys = pts.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mn === mx) { mn -= 1; mx += 1; }
  const pad = (mx - mn) * .15; mn -= pad; mx += pad;
  const X = i => pts.length === 1 ? W / 2 : P + i * (W - P - 10) / (pts.length - 1);
  const Y = v => 10 + (H - 34) * (1 - (v - mn) / (mx - mn));
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = `${d}L${X(pts.length - 1).toFixed(1)},${H - 24}L${X(0).toFixed(1)},${H - 24}Z`;
  const step = Math.ceil(pts.length / 5);
  const lbl = pts.map((p, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${X(i)}" y="${H - 8}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${esc(p.x)}</text>` : '').join('');
  const dots = pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="${color}"/>`).join('');
  const grid = [mn + pad, (mn + mx) / 2, mx - pad].map(v => `<line x1="${P}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P - 4}" y="${Y(v) + 3}" font-size="9" text-anchor="end" fill="var(--muted)">${r1(v)}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid}<path d="${area}" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lbl}</svg></div>`;
}

/* ===== Antrenman oturumu ===== */
function startSession(dayId) {
  const W = S.workout;
  const begin = () => {
    const d = dayId ? W.days.find(x => x.id === dayId) : null;
    W.active = {
      dayId, name: d ? d.name : 'Serbest antrenman', start: Date.now(),
      entries: d ? d.items.map(it => newEntry(it.exId, +it.sets || 3, it.reps)) : []
    };
    save(); navStack = [{ tab: 'sport', page: 'sport' }]; route = { tab: 'sport', page: 'session' }; render(); window.scrollTo(0, 0);
  };
  if (W.active) confirmSheet('Devam eden bir antrenman var. Onu silip yenisine başlansın mı?', begin, 'Yeniden başla'); else begin();
}
function newEntry(exId, n = 3, reps = '10') {
  const lp = lastPerf(exId); const rr = String(reps).match(/\d+/g); const target = rr ? rr[rr.length - 1] : '';
  const sets = []; for (let i = 0; i < n; i++) { const prev = lp?.sets[i] || lp?.sets[lp.sets.length - 1]; sets.push({ w: prev ? prev.w : '', r: prev ? prev.r : target, done: false }); }
  return { exId, reps, sets };
}
Pages.session = () => {
  const A = S.workout.active; if (!A) { route.page = 'sport'; return Pages.sport(); }
  const doneSets = A.entries.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
  const totalSets = A.entries.reduce((a, e) => a + e.sets.length, 0);
  const ents = A.entries.map((e, ei) => {
    const ex = exById(e.exId); const lp = lastPerf(e.exId);
    return `<div class="card"><div class="row" style="margin-bottom:6px"><div onclick="go('ex','${e.exId}')" style="cursor:pointer">${exThumb(ex)}</div><div class="grow"><div class="b">${esc(ex?.name || '?')}</div><div class="tiny muted">Hedef: ${esc(e.reps || '-')} tekrar${lp ? ` · Son (${fmtDate(lp.log.date, { day: 'numeric', month: 'short' })}): ${lp.sets.map(s => `${s.w || 0}×${s.r || 0}`).join(', ')}` : ''}</div></div><button class="muted" style="font-size:20px;padding:4px" onclick="entryMenu(${ei})">⋯</button></div>
      <div class="set-row tiny muted b"><span class="no">SET</span><span style="text-align:center">KG</span><span style="text-align:center">TEKRAR</span><span></span></div>
      ${e.sets.map((s, si) => `<div class="set-row ${s.done ? 'ok' : ''}" id="sr_${ei}_${si}"><span class="no">${si + 1}</span><input inputmode="decimal" value="${esc(s.w)}" placeholder="0" oninput="setVal(${ei},${si},'w',this.value)"><input inputmode="numeric" value="${esc(s.r)}" placeholder="0" oninput="setVal(${ei},${si},'r',this.value)"><button class="chk" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}
      <div class="row" style="margin-top:8px"><button class="btn plain sm grow" onclick="addSet(${ei})">+ Set ekle</button>${e.sets.length > 1 ? `<button class="btn plain sm" onclick="delSet(${ei})">− Set</button>` : ''}</div></div>`;
  }).join('');
  const live = dayLoad(A.entries.map(e => ({ exId: e.exId, sets: e.sets.filter(s => s.done).length })));
  return header(esc(A.name), `<span id="elapsed">${elapsed(A.start)}</span> · ${doneSets}/${totalSets} set`) + `
  <div class="bar" style="margin:-6px 0 14px"><i style="width:${totalSets ? doneSets / totalSets * 100 : 0}%;background:var(--ok)"></i></div>
  ${ents || '<div class="empty"><div class="e">🏋️</div>Hareket ekleyerek başla</div>'}
  <button class="btn ghost full" style="margin-bottom:12px" onclick="pickExercise(ex=>{S.workout.active.entries.push(newEntry(ex.id));save();render();})">+ Hareket ekle</button>
  <div class="card"><h3>Bu antrenmanda çalışan kaslar</h3><div class="body-map" style="max-width:280px;margin:0 auto">${bodySVG(live)}</div>${muscleBars(live)}</div>
  <div class="field"><label>Antrenman notu</label><textarea rows="2" oninput="S.workout.active.note=this.value;save()" placeholder="Nasıl hissettin?">${esc(A.note || '')}</textarea></div>
  <button class="btn full" style="background:var(--ok);margin-bottom:10px" onclick="finishSession()">✓ Antrenmanı bitir</button>
  <button class="btn danger full" onclick="confirmSheet('Bu antrenman kaydedilmeden silinecek.',()=>{S.workout.active=null;save();setTab('sport')},'İptal et')">Antrenmanı iptal et</button>`;
};
Pages.session.after = () => { clearInterval(window._el); window._el = setInterval(() => { const e = $('#elapsed'); if (e && S.workout.active) e.textContent = elapsed(S.workout.active.start); else clearInterval(window._el); }, 1000); };
function elapsed(t) { const s = Math.floor((Date.now() - t) / 1000); const h = Math.floor(s / 3600); return (h ? h + ':' : '') + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
function setVal(ei, si, k, v) { S.workout.active.entries[ei].sets[si][k] = v.replace(',', '.'); save(); }
function toggleSet(ei, si) {
  const s = S.workout.active.entries[ei].sets[si]; s.done = !s.done; save();
  if (s.done) { const nxt = S.workout.active.entries[ei].sets[si + 1]; if (nxt && nxt.w === '' && s.w !== '') nxt.w = s.w; startRest(); }
  render();
}
function addSet(ei) { const e = S.workout.active.entries[ei]; const l = e.sets[e.sets.length - 1]; e.sets.push({ w: l ? l.w : '', r: l ? l.r : '', done: false }); save(); render(); }
function delSet(ei) { S.workout.active.entries[ei].sets.pop(); save(); render(); }
function entryMenu(ei) {
  const A = S.workout.active; const ex = exById(A.entries[ei].exId);
  const s = openSheet({ title: ex?.name || '', body: `<button class="btn plain full" id="m1" style="margin-bottom:8px">▲ Yukarı taşı</button><button class="btn plain full" id="m2" style="margin-bottom:8px">▼ Aşağı taşı</button><button class="btn danger full" id="m3">Bu antrenmandan çıkar</button>` });
  const mv = d => { const j = ei + d; if (j < 0 || j >= A.entries.length) return; [A.entries[ei], A.entries[j]] = [A.entries[j], A.entries[ei]]; save(); closeSheet(s); render(); };
  s.sh.querySelector('#m1').onclick = () => mv(-1); s.sh.querySelector('#m2').onclick = () => mv(1);
  s.sh.querySelector('#m3').onclick = () => { A.entries.splice(ei, 1); save(); closeSheet(s); render(); };
}
function finishSession() {
  const A = S.workout.active;
  const entries = A.entries.map(e => ({ exId: e.exId, sets: e.sets.filter(s => s.done).map(s => ({ w: num(s.w), r: num(s.r) })) })).filter(e => e.sets.length);
  if (!entries.length) { toast('Önce en az bir seti ✓ ile işaretle'); return; }
  const prs = [];
  entries.forEach(e => { const h = exHistory(e.exId); const prev = h.length ? Math.max(...h.map(p => p.best)) : 0; const best = Math.max(...e.sets.map(s => s.w)); if (h.length && best > prev) prs.push(exById(e.exId)?.name); });
  S.workout.logs.push({ id: uid(), ts: Date.now(), date: today(), dayId: A.dayId, name: A.name, entries, note: A.note || '', min: Math.round((Date.now() - A.start) / 60000) });
  S.workout.active = null; stopRest(); save(); setTab('sport');
  toast(prs.length ? '🏆 Yeni rekor: ' + prs.join(', ') : '💪 Antrenman kaydedildi');
}

/* Dinlenme sayacı */
let restEnd = 0, restInt;
function startRest(sec) {
  sec = sec || S.settings.rest || 90; restEnd = Date.now() + sec * 1000;
  let el = $('#timer'); if (!el) { el = document.createElement('div'); el.id = 'timer'; el.className = 'timer'; document.body.append(el); }
  const draw = () => {
    const left = Math.max(0, Math.round((restEnd - Date.now()) / 1000));
    el.innerHTML = `<span>⏱</span><div class="grow"><div class="tiny" style="opacity:.7">Dinlenme</div><div class="tm">${Math.floor(left / 60)}:${pad(left % 60)}</div></div><button onclick="restEnd-=15000">−15</button><button onclick="restEnd+=15000">+15</button><button onclick="stopRest()">✕</button>`;
    if (left <= 0) { beep(); stopRest(); toast('⏰ Dinlenme bitti, sıradaki set!'); }
  };
  clearInterval(restInt); draw(); restInt = setInterval(draw, 500);
}
function stopRest() { clearInterval(restInt); const el = $('#timer'); if (el) el.remove(); }
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(c.destination); o.start(c.currentTime + t); o.stop(c.currentTime + t + .15); }); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}

const MEALS = [['b', 'Kahvaltı', '🌅'], ['l', 'Öğle', '☀️'], ['d', 'Akşam', '🌙'], ['s', 'Ara öğün', '🍎']];
const allFoods = () => [...S.diet.foods, ...BUILTIN_FOODS];
const foodById = id => allFoods().find(f => f.id === id);
const macrosOf = e => { const k = e.g / 100; return { kcal: e.per.kcal * k, p: e.per.p * k, c: e.per.c * k, f: e.per.f * k }; };
function dayTotals(k) {
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  (S.diet.log[k] || []).forEach(e => { const m = macrosOf(e); for (const x in t) t[x] += m[x]; });
  return t;
}
let dietDay = null;

function ring(val, max, color, size = 118, sw = 12) {
  const r = (size - sw) / 2, C = 2 * Math.PI * r, p = Math.min(1, max ? val / max : 0);
  return `<svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--card-2)" stroke-width="${sw}" fill="none"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${color}" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/></svg>`;
}
function macroBar(lbl, v, t, col) {
  return `<div class="macro"><div class="row between"><span class="b">${lbl}</span><span class="muted">${Math.round(v)} / ${t} g</span></div><div class="bar"><i style="width:${Math.min(100, t ? v / t * 100 : 0)}%;background:${col}"></i></div></div>`;
}
const MC = { p: '#FF6B8A', c: '#FFB020', f: '#4DA3FF' };

Pages.diet = () => {
  const k = dietDay || today(); const T = S.diet.targets; const t = dayTotals(k);
  const left = T.kcal - t.kcal;
  const water = S.diet.water[k] || 0; const glasses = Math.max(8, Math.ceil(T.water / 250));
  const log = S.diet.log[k] || [];
  const meals = MEALS.map(([m, name, ic]) => {
    const es = log.filter(e => e.meal === m); const kc = es.reduce((a, e) => a + macrosOf(e).kcal, 0);
    return `<div class="card tight"><div class="row between" style="padding:12px 16px 6px"><div class="b">${ic} ${name}</div><div class="row"><span class="small muted">${Math.round(kc)} kcal</span><button class="btn ghost sm" onclick="addFood('${k}','${m}')">+ Ekle</button></div></div>
      ${es.map(e => { const mm = macrosOf(e); return `<div class="list-item" onclick="editLogEntry('${k}','${e.id}')" style="cursor:pointer;padding:9px 16px"><div class="grow"><div class="small b ellip">${esc(e.name)}</div><div class="tiny muted">${e.qty ? `${r1(e.qty)} ${esc(e.unitName)} · ` : ''}${Math.round(e.g)} g · P ${r1(mm.p)} · K ${r1(mm.c)} · Y ${r1(mm.f)}</div></div><span class="small b">${Math.round(mm.kcal)}</span></div>`; }).join('')}</div>`;
  }).join('');
  const w = S.diet.weight; const lastW = w.length ? w[w.length - 1] : null;
  const isToday = k === today();
  return header('Diyet', `<button onclick="dietDay=addDays('${k}',-1);render()" style="color:var(--accent);font-weight:700">‹</button> ${isToday ? 'Bugün' : fmtDate(k, { weekday: 'long', day: 'numeric', month: 'long' })} <button onclick="dietDay=addDays('${k}',1);render()" style="color:var(--accent);font-weight:700">›</button>`, `<button class="icon-btn" onclick="editTargets()">⚙︎</button>`) + `
  <div class="card"><div class="ring-wrap"><div class="ring">${ring(t.kcal, T.kcal, left < 0 ? 'var(--bad)' : 'var(--accent)')}<div class="c"><b>${Math.round(Math.abs(left))}</b><span class="tiny muted">${left < 0 ? 'kcal fazla' : 'kcal kaldı'}</span></div></div>
    <div class="grow"><div class="small muted" style="margin-bottom:4px">${Math.round(t.kcal)} / ${T.kcal} kcal</div>${macroBar('Protein', t.p, T.p, MC.p)}${macroBar('Karbonhidrat', t.c, T.c, MC.c)}${macroBar('Yağ', t.f, T.f, MC.f)}</div></div></div>
  <div class="row" style="margin-bottom:12px"><button class="btn ghost grow sm" onclick="applyPlan('${k}')">📋 Diyet planını bu güne ekle</button><button class="btn plain sm" onclick="go('dietplan')">Planı düzenle</button></div>
  ${meals}
  <div class="card"><div class="row between"><h3 style="margin:0">💧 Su</h3><span class="small b">${(water / 1000).toLocaleString('tr-TR')} / ${(T.water / 1000).toLocaleString('tr-TR')} L</span></div>
    <div class="water" style="margin-top:10px">${Array.from({ length: glasses }, (_, i) => `<i class="${i < water / 250 ? 'on' : ''}" onclick="setWater('${k}',${i})"></i>`).join('')}</div><div class="tiny muted" style="margin-top:6px">Her bardak 250 ml — dokunarak işaretle</div></div>
  <div class="card"><div class="row between"><h3 style="margin:0">⚖️ Kilo</h3><button class="btn ghost sm" onclick="addWeight()">+ Tartıl</button></div>
    ${lastW ? `<div class="kpi" style="margin:8px 0 4px">${lastW.kg} kg <span class="small muted">${fmtDate(lastW.date)}</span>${w.length > 1 ? ` <span class="small" style="color:${lastW.kg - w[0].kg <= 0 ? 'var(--ok)' : 'var(--warn)'}">${lastW.kg - w[0].kg > 0 ? '+' : ''}${r1(lastW.kg - w[0].kg)} kg</span>` : ''}</div>` : ''}
    ${lineChart(w.slice(-20).map(x => ({ x: fmtDate(x.date, { day: 'numeric', month: 'short' }), y: x.kg })), { color: '#30C26B' })}</div>
  <div class="card"><h3>Son 7 gün (kcal)</h3>${weekBars()}</div>`;
};
function weekBars() {
  const T = S.diet.targets.kcal; const ds = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
  const vals = ds.map(d => dayTotals(d).kcal); const mx = Math.max(T * 1.2, ...vals);
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:120px;position:relative">
    <div style="position:absolute;left:0;right:0;bottom:${T / mx * 96 + 22}px;border-top:1.5px dashed var(--muted);opacity:.5"></div>
    ${ds.map((d, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%"><div style="width:100%;max-width:30px;border-radius:7px;background:${vals[i] > T ? 'var(--warn)' : 'var(--accent)'};height:${Math.max(3, vals[i] / mx * 96)}px;opacity:${vals[i] ? 1 : .2}"></div><span class="tiny muted">${WD[parseD(d).getDay()]}</span></div>`).join('')}</div>`;
}
function setWater(k, i) { const cur = S.diet.water[k] || 0; const nv = (i + 1) * 250; S.diet.water[k] = cur === nv ? i * 250 : nv; save(); render(); }
function addWeight() {
  const last = S.diet.weight[S.diet.weight.length - 1];
  const s = openSheet({
    title: 'Kilo gir', left: 'Vazgeç', right: 'Kaydet',
    body: `<div class="field"><label>Kilo (kg)</label><input id="wk" inputmode="decimal" value="${last ? last.kg : ''}"></div><div class="field"><label>Tarih</label><input id="wd" type="date" value="${today()}"></div>
    ${S.diet.weight.length ? `<div class="card tight">${[...S.diet.weight].reverse().slice(0, 10).map(w => `<div class="list-item"><div class="grow">${fmtDate(w.date, { day: 'numeric', month: 'long', year: 'numeric' })}</div><b>${w.kg} kg</b><button class="muted" data-del="${w.date}">✕</button></div>`).join('')}</div>` : ''}`,
    onRight: sh => {
      const kg = num(sh.querySelector('#wk').value); const date = sh.querySelector('#wd').value || today(); if (!kg) { toast('Kilo gir'); return false; }
      S.diet.weight = S.diet.weight.filter(w => w.date !== date); S.diet.weight.push({ date, kg }); S.diet.weight.sort((a, b) => a.date < b.date ? -1 : 1); save(); render();
    }
  });
  s.sh.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.diet.weight = S.diet.weight.filter(w => w.date !== b.dataset.del); save(); b.closest('.list-item').remove(); render(); });
}
function editTargets() {
  const T = S.diet.targets; const lastW = S.diet.weight.length ? S.diet.weight[S.diet.weight.length - 1].kg : '';
  const s = openSheet({
    title: 'Günlük hedefler', left: 'Vazgeç', right: 'Kaydet',
    body: `<div class="field"><label>Kalori (kcal)</label><input id="tk" inputmode="numeric" value="${T.kcal}"></div>
    <div class="grid3"><div class="field"><label>Protein (g)</label><input id="tp" inputmode="numeric" value="${T.p}"></div><div class="field"><label>Karb. (g)</label><input id="tc" inputmode="numeric" value="${T.c}"></div><div class="field"><label>Yağ (g)</label><input id="tf" inputmode="numeric" value="${T.f}"></div></div>

    <div class="card"><h3>Makroları kaloriye göre dağıt</h3><div class="small muted" style="margin-bottom:8px">Protein kilona göre (g/kg), yağ kalorinin %25'i, kalanı karbonhidrat.</div>
      <div class="grid2"><div class="field"><label>Kilon (kg)</label><input id="ck" inputmode="decimal" value="${lastW}"></div><div class="field"><label>Protein g/kg</label><input id="cp" inputmode="decimal" value="2"></div></div>
      <button class="btn plain full sm" id="calc">Hesapla</button></div>
    <div class="tiny muted">Hedefleri bir diyetisyen veya antrenörle belirlemen en doğrusu; buradaki hesap sadece kolaylık için.</div>`,
    onRight: sh => { Object.assign(T, { kcal: num(sh.querySelector('#tk').value) || 2000, p: num(sh.querySelector('#tp').value), c: num(sh.querySelector('#tc').value), f: num(sh.querySelector('#tf').value), water: num(sh.querySelector('#tw').value) || 2500 }); save(); render(); }
  });
  const sum = () => { const p = num(s.sh.querySelector('#tp').value), c = num(s.sh.querySelector('#tc').value), f = num(s.sh.querySelector('#tf').value); s.sh.querySelector('#tsum').textContent = `Makroların toplamı: ${Math.round(p * 4 + c * 4 + f * 9)} kcal`; };
  s.sh.querySelectorAll('#tp,#tc,#tf').forEach(i => i.oninput = sum); sum();
  s.sh.querySelector('#calc').onclick = () => {
    const kc = num(s.sh.querySelector('#tk').value), kg = num(s.sh.querySelector('#ck').value), gk = num(s.sh.querySelector('#cp').value);
    if (!kc || !kg) { toast('Kalori ve kilo gir'); return; }
    const p = Math.round(kg * gk), f = Math.round(kc * .25 / 9), c = Math.max(0, Math.round((kc - p * 4 - f * 9) / 4));

}

/* Besin ekleme */
function addFood(k, meal, target = null) {
  // target: plan dizisi; null ise günlük kayıt
  let q = '';
  const s = openSheet({ title: 'Besin ekle · ' + MEALS.find(m => m[0] === meal)[1], left: 'Bitti', body: `<input id="fq" placeholder="Besin ara…" style="margin-bottom:10px"><div class="row" style="margin-bottom:10px"><button class="btn ghost sm grow" id="fnew">+ Yeni besin</button><button class="btn plain sm grow" id="fquick">⚡ Hızlı kalori ekle</button></div><div class="card tight" id="fl"></div>` });
  const draw = () => {
    const ql = q.toLocaleLowerCase('tr');
    const recentIds = [...new Set(Object.values(S.diet.log).flat().slice(-60).reverse().map(e => e.foodId).filter(Boolean))];
    let list = allFoods().filter(f => !ql || f.name.toLocaleLowerCase('tr').includes(ql));
    if (!ql) list.sort((a, b) => { const ia = recentIds.indexOf(a.id), ib = recentIds.indexOf(b.id); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });
    s.sh.querySelector('#fl').innerHTML = list.map(f => `<div class="list-item" data-id="${f.id}" style="cursor:pointer;padding:10px 16px"><div class="grow"><div class="small b">${esc(f.name)}${recentIds.includes(f.id) && !ql ? ' <span class="tag">son</span>' : ''}</div><div class="tiny muted">100 g: ${f.kcal} kcal · P ${f.p} · K ${f.c} · Y ${f.f}${f.unit ? ` · 1 ${f.unit.n} ≈ ${f.unit.g} g` : ''}</div></div><span style="color:var(--accent);font-size:22px">＋</span></div>`).join('') || '<div class="empty">Bulunamadı — "Yeni besin" ile ekle</div>';
    s.sh.querySelectorAll('#fl [data-id]').forEach(el => el.onclick = () => amountSheet(foodById(el.dataset.id), k, meal, target));
  };
  s.sh.querySelector('#fq').oninput = e => { q = e.target.value; draw(); };
  s.sh.querySelector('#fnew').onclick = () => editFood(null, f => amountSheet(f, k, meal, target));
  s.sh.querySelector('#fquick').onclick = () => quickAdd(k, meal, target);
  draw();
}
function pushEntry(k, e, target) { if (target) target.push(e); else (S.diet.log[k] = S.diet.log[k] || []).push(e); save(); render(); }
function amountSheet(f, k, meal, target, entry = null) {
  const hasU = !!f.unit; let mode = entry ? (entry.qty ? 'u' : 'g') : (hasU ? 'u' : 'g');
  const s = openSheet({
    title: f.name, left: 'Vazgeç', right: entry ? 'Kaydet' : 'Ekle',
    body: `${hasU ? `<div class="seg" id="am"><button data-m="u" class="${mode === 'u' ? 'on' : ''}">${esc(f.unit.n)}</button><button data-m="g" class="${mode === 'g' ? 'on' : ''}">gram</button></div>` : ''}
    <div class="field"><label id="al">Miktar</label><input id="aq" inputmode="decimal" value="${entry ? (entry.qty || entry.g) : (hasU ? 1 : 100)}"></div>
    <div class="card" id="ap"></div>`,
    onRight: sh => {
      const v = num(sh.querySelector('#aq').value); if (!v) { toast('Miktar gir'); return false; }
      const g = mode === 'u' ? v * f.unit.g : v;
      const e = { id: entry?.id || uid(), meal, foodId: f.id, name: f.name, g, per: { kcal: f.kcal, p: f.p, c: f.c, f: f.f }, qty: mode === 'u' ? v : 0, unitName: mode === 'u' ? f.unit.n : '' };
      if (entry) { Object.assign(entry, e); save(); render(); } else { pushEntry(k, e, target); toast(f.name + ' eklendi'); }
    }
  });
  const upd = () => {
    const v = num(s.sh.querySelector('#aq').value); const g = mode === 'u' ? v * f.unit.g : v; const x = g / 100;
    s.sh.querySelector('#al').textContent = mode === 'u' ? `Kaç ${f.unit.n}? (1 ${f.unit.n} ≈ ${f.unit.g} g)` : 'Gram';
    s.sh.querySelector('#ap').innerHTML = `<div class="row between"><div><div class="kpi">${Math.round(f.kcal * x)}</div><div class="tiny muted">kcal · ${Math.round(g)} g</div></div><div class="small" style="text-align:right"><div><b style="color:${MC.p}">P</b> ${r1(f.p * x)} g</div><div><b style="color:${MC.c}">K</b> ${r1(f.c * x)} g</div><div><b style="color:${MC.f}">Y</b> ${r1(f.f * x)} g</div></div></div>`;
  };
  s.sh.querySelector('#aq').oninput = upd;
  s.sh.querySelectorAll('#am button').forEach(b => b.onclick = () => {
    const v = num(s.sh.querySelector('#aq').value); const nm = b.dataset.m; if (nm === mode) return;
    s.sh.querySelector('#aq').value = nm === 'g' ? Math.round(v * f.unit.g) : r1(v / f.unit.g); mode = nm;
    s.sh.querySelectorAll('#am button').forEach(x => x.classList.toggle('on', x === b)); upd();
  });
  upd();
}
function quickAdd(k, meal, target) {

    onRight: sh => { const g = id => num(sh.querySelector(id).value); if (!g('#qk')) { toast('Kalori gir'); return false; } pushEntry(k, { id: uid(), meal, name: sh.querySelector('#qn').value.trim() || 'Hızlı ekleme', g: 100, per: { kcal: g('#qk'), p: g('#qp'), c: g('#qc'), f: g('#qf') }, qty: 0, unitName: '' }, target); }
  });
}
function editFood(id, cb) {
  const f = id ? S.diet.foods.find(x => x.id === id) : null;
  const s = openSheet({
    title: f ? 'Besini düzenle' : 'Yeni besin', left: 'Vazgeç', right: 'Kaydet',

    <div class="grid2"><div class="field"><label>Kalori</label><input id="nk" inputmode="decimal" value="${f?.kcal ?? ''}"></div><div class="field"><label>Protein (g)</label><input id="np" inputmode="decimal" value="${f?.p ?? ''}"></div><div class="field"><label>Karb. (g)</label><input id="nc" inputmode="decimal" value="${f?.c ?? ''}"></div><div class="field"><label>Yağ (g)</label><input id="nf" inputmode="decimal" value="${f?.f ?? ''}"></div></div>

    ${f ? '<button class="btn danger full" id="nd">Besini sil</button>' : ''}`,
    onRight: sh => {
      const g = id => num(sh.querySelector(id).value); const name = sh.querySelector('#nn').value.trim(); if (!name) { toast('Besin adı gir'); return false; }
      const un = sh.querySelector('#nu').value.trim(), ug = g('#ng');
      let o = f; if (!o) { o = { id: uid() }; S.diet.foods.unshift(o); }
      Object.assign(o, { name, kcal: g('#nk'), p: g('#np'), c: g('#nc'), f: g('#nf'), unit: un && ug ? { n: un, g: ug } : null }); save(); render(); cb && cb(o);
    }
  });
  const d = s.sh.querySelector('#nd'); if (d) d.onclick = () => { S.diet.foods.splice(S.diet.foods.indexOf(f), 1); save(); closeSheet(s); render(); };
}
function editLogEntry(k, id, target = null) {
  const list = target || S.diet.log[k]; const e = list.find(x => x.id === id);
  const f = (e.foodId && foodById(e.foodId)) || null;
  if (f) {
    amountSheet(f, k, e.meal, target, e);
    const s = sheetStack[sheetStack.length - 1];
    const b = document.createElement('button'); b.className = 'btn danger full'; b.textContent = 'Sil';
    b.onclick = () => { list.splice(list.indexOf(e), 1); save(); closeSheet(s); render(); }; s.sh.querySelector('.sheet-b').append(b);
  } else confirmSheet(`"${e.name}" silinsin mi?`, () => { list.splice(list.indexOf(e), 1); save(); render(); });

function applyPlan(k) {
  if (!S.diet.plan.length) { toast('Önce diyet planını oluştur'); go('dietplan'); return; }

}

Pages.dietplan = () => {
  const P = S.diet.plan; const t = { kcal: 0, p: 0, c: 0, f: 0 }; P.forEach(e => { const m = macrosOf(e); for (const x in t) t[x] += m[x]; });
